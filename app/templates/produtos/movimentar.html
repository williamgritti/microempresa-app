{% extends 'base.html' %}

{% block title %}Movimentar Estoque - Sistema de Gestão{% endblock %}
{% block page_title %}Movimentar Estoque{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-box-seam me-2"></i>{{ produto.nome }}
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <strong>Estoque atual:</strong> {{ produto.quantidade }} {{ produto.unidade }}
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Tipo de Movimentação *</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="tipo" id="entrada" value="entrada" checked>
                            <label class="btn btn-outline-success" for="entrada">
                                <i class="bi bi-box-arrow-in-down"></i> Entrada
                            </label>

                            <input type="radio" class="btn-check" name="tipo" id="saida" value="saida">
                            <label class="btn btn-outline-danger" for="saida">
                                <i class="bi bi-box-arrow-up"></i> Saída
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantidade *</label>
                        <div class="input-group">
                            <input type="text" name="quantidade" class="form-control" required
                                   placeholder="0" id="quantidade">
                            <span class="input-group-text">{{ produto.unidade }}</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Motivo</label>
                        <input type="text" name="motivo" class="form-control" list="motivos"
                               placeholder="Ex: Compra de fornecedor, Venda, Ajuste de inventário...">
                        <datalist id="motivos">
                            <option value="Compra de fornecedor">
                            <option value="Venda">
                            <option value="Devolução de cliente">
                            <option value="Devolução para fornecedor">
                            <option value="Ajuste de inventário">
                            <option value="Perda/Avaria">
                            <option value="Consumo interno">
                        </datalist>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Confirmar
                        </button>
                        <a href="{{ url_for('produtos.visualizar', id=produto.id) }}" class="btn btn-secondary">
                            <i class="bi bi-x-lg"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
